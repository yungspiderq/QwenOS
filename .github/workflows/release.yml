name: Release on tag
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zip site
        run: zip -r QwenOS-${GITHUB_REF_NAME}.zip public README.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QwenOS-${{ github.ref_name }}.zip
          generate_release_notes: true
