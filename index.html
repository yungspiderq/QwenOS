<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebOS — операционная система в браузере</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран загрузки / логин -->
<div id="boot-screen">
  <div class="boot-logo">
    <div class="logo-cube"><span></span><span></span><span></span><span></span></div>
    <h1>Web<span>OS</span></h1>
    <p>Версия 1.0 · HTML Edition</p>
  </div>
  <div class="boot-progress"><div id="boot-bar"></div></div>
</div>

<div id="login-screen" class="hidden">
  <div class="login-card">
    <div class="avatar">👤</div>
    <div class="login-name">Пользователь</div>
    <input id="login-input" type="password" placeholder="Введите пароль (или Enter)" autocomplete="off">
    <button id="login-btn">Войти</button>
    <div class="login-hint">Подсказка: пароль любой, просто нажмите Enter</div>
  </div>
  <div class="login-clock">
    <div id="login-time" class="big-time"></div>
    <div id="login-date" class="big-date"></div>
  </div>
</div>

<!-- Рабочий стол -->
<div id="desktop" class="hidden">
  <!-- Обои -->
  <div id="wallpaper"></div>

  <!-- Иконки рабочего стола -->
  <div id="icons"></div>

  <!-- Окна добавляются сюда -->
  <div id="windows"></div>

  <!-- Контекстное меню -->
  <div id="context-menu" class="hidden"></div>

  <!-- Меню "Пуск" -->
  <div id="start-menu" class="hidden">
    <div class="start-search-wrap"><input id="start-search" placeholder="Поиск приложений..."></div>
    <div id="start-apps"></div>
    <div class="start-footer">
      <button id="btn-lock" title="Блокировка">🔒 Заблокировать</button>
      <button id="btn-restart" title="Перезагрузка">🔄 Перезагрузка</button>
    </div>
  </div>

  <!-- Панель уведомлений -->
  <div id="notifications"></div>

  <!-- Синий экран (шутка) -->
  <div id="bsod" class="hidden">
    <h1>:(</h1>
    <p>На вашем ПК возникла проблема, и его нужно перезагрузить.</p>
    <p class="bsod-small">Just kidding — это же веб-ОС 😉 Нажмите любую кнопку.</p>
    <button id="bsod-ok">Перезагрузить</button>
  </div>

  <!-- Панель задач -->
  <div id="taskbar">
    <button id="start-btn" title="Пуск">
      <svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="1" width="8" height="8" rx="1"/><rect x="11" y="1" width="8" height="8" rx="1"/><rect x="1" y="11" width="8" height="8" rx="1"/><rect x="11" y="11" width="8" height="8" rx="1"/></svg>
    </button>
    <div id="taskbar-items"></div>
    <div id="tray">
      <span id="tray-battery" title="Заряд батареи">🔋</span>
      <span id="tray-volume" title="Громкость">🔊</span>
      <div id="clock">
        <div id="taskbar-time"></div>
        <div id="taskbar-date"></div>
      </div>
    </div>
  </div>
</div>

<script src="apps.js"></script>
<script src="os.js"></script>
</body>
</html>
